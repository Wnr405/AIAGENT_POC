# 05-METRICS §11.6 G-05 (main-branch gate) → §11.7 G-06 (staging deploy).
name: Main
on:
  push:
    branches: [main]
permissions: { contents: read, packages: write, id-token: write }

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir cms-api prisma:generate
      - run: pnpm -r test:cov
      - run: pnpm --dir cms-api test:integration

  images:
    needs: verify
    runs-on: ubuntu-latest
    outputs: { tag: "${{ steps.meta.outputs.tag }}" }
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          {
            registry: ghcr.io,
            username: "${{ github.actor }}",
            password: "${{ secrets.GITHUB_TOKEN }}",
          }
      - uses: docker/build-push-action@v6
        with:
          context: cms-api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cms-api:${{ steps.meta.outputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: cms-web
          target: dist
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cms-web-dist:${{ steps.meta.outputs.tag }}
      - name: Trivy — 0 critical/high
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/cms-api:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          {
            image: "ghcr.io/${{ github.repository_owner }}/cms-api:${{ steps.meta.outputs.tag }}",
            format: spdx-json,
          }
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/cms-api:${{ steps.meta.outputs.tag }}

  deploy-staging:
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: ALLOW_FRIDAY=yes /opt/cms/current/scripts/deploy.sh ${{ needs.images.outputs.tag }}
