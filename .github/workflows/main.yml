# 05-METRICS §11.6 G-05 (main-branch gate) → §11.7 G-06 (staging deploy).
name: Main
on:
  push:
    branches: [main]
permissions: { contents: read, packages: write, id-token: write }

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir cms-api prisma:generate
      - run: pnpm -r test:cov
      - run: pnpm --dir cms-api test:integration

  images:
    needs: verify
    runs-on: ubuntu-latest
    outputs: { tag: "${{ steps.meta.outputs.tag }}" }
    steps:
      - uses: actions/checkout@v4
      - id: meta
        # GHCR repository names must be lowercase; the owner (`Wnr405`) is not, and expressions have no lower().
        run: |
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          {
            registry: ghcr.io,
            username: "${{ github.actor }}",
            password: "${{ secrets.GITHUB_TOKEN }}",
          }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cms-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.registry }}/cms-api:${{ steps.meta.outputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cms-web/Dockerfile
          target: dist
          push: true
          tags: ${{ steps.meta.outputs.registry }}/cms-web-dist:${{ steps.meta.outputs.tag }}
      - name: Trivy — 0 critical/high
        # Pinned to the immutable v0.36.0 release commit: the unprefixed `0.28.0` tag no longer exists, and this
        # action's tags have been re-pointed before, so a SHA (Dependabot still updates it) beats a mutable tag.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.registry }}/cms-api:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          {
            image: "${{ steps.meta.outputs.registry }}/cms-api:${{ steps.meta.outputs.tag }}",
            format: spdx-json,
          }
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes ${{ steps.meta.outputs.registry }}/cms-api:${{ steps.meta.outputs.tag }}

  deploy-staging:
    needs: images
    # Opt-in until a staging VM exists: set the repository variable STAGING_DEPLOY_ENABLED=true together with
    # the staging environment secrets STAGING_HOST and STAGING_SSH_KEY. Until then the job shows as SKIPPED,
    # never as a passed G-06 (05-METRICS §11.7) — a skipped staging deploy is not a successful one.
    if: vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Staging secrets present
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing STAGING_HOST"
          [ -n "$KEY" ] || missing="$missing STAGING_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::STAGING_DEPLOY_ENABLED is true but the staging environment lacks:$missing"
            exit 1
          fi
      - name: Deploy to staging VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: ALLOW_FRIDAY=yes /opt/cms/current/scripts/deploy.sh ${{ needs.images.outputs.tag }}
