# 07-OPS-ARCH §9.2 — base definition. Launch:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d
name: cms

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]

services:
  nginx:
    <<: *hardening
    image: nginx:1.27-alpine
    container_name: cms-nginx
    depends_on:
      cms-api: { condition: service_healthy }
    ports: ["80:80", "443:443"]
    environment:
      SERVER_NAME: ${SERVER_NAME}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/templates:ro # *.template → envsubst → /etc/nginx/conf.d
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - /etc/cms/tls:/etc/cms/tls:ro
      - ./web-dist:/usr/share/nginx/html:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks: [cms-edge, cms-internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cms-api:
    <<: *hardening
    image: ${CMS_API_IMAGE:-ghcr.io/org/cms-api:1.0.0}
    container_name: cms-api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    env_file: .env
    environment:
      ROLE: api
    networks: [cms-internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    read_only: true
    tmpfs: [/tmp]

  cms-worker:
    <<: *hardening
    image: ${CMS_API_IMAGE:-ghcr.io/org/cms-api:1.0.0}
    container_name: cms-worker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env
    environment:
      ROLE: worker
    command: ["node", "dist/worker.js"]
    networks: [cms-internal]
    healthcheck:
      test: ["CMD", "node", "dist/scripts/worker-heartbeat.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs: [/tmp]

  postgres:
    <<: *hardening
    image: postgres:15-alpine
    container_name: cms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /var/lib/cms/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [cms-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb

  redis:
    <<: *hardening
    image: redis:7-alpine
    container_name: cms-redis
    # noeviction (not allkeys-lru): BullMQ jobs must never be evicted. Cache keys all carry TTLs.
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
        "--maxmemory",
        "1gb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes: [/var/lib/cms/redis:/data]
    networks: [cms-internal]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    <<: *hardening
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z # pinned: `latest` is forbidden in production (§10.1)
    container_name: cms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [/var/lib/cms/minio:/data]
    networks: [cms-internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: cms-node-exporter
    restart: unless-stopped
    pid: host
    network_mode: host
    volumes: ["/:/host:ro,rslave"]
    command:
      [
        "--path.rootfs=/host",
        "--collector.systemd",
        "--no-collector.wifi",
        "--web.listen-address=127.0.0.1:9100",
        "--collector.textfile.directory=/host/var/lib/cms/backups/metrics",
      ]

networks:
  cms-edge:
    driver: bridge
  cms-internal:
    driver: bridge
    internal: false # set true + egress proxy if compliance requires (§5.2)
