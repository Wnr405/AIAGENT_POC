# Off-host Prometheus scrape config (07-OPS-ARCH §15.2). cms-api /metrics is only
# reachable on the internal network or through an SSH tunnel / private link.
scrape_configs:
  - job_name: cms-api
    metrics_path: /metrics
    static_configs: [{ targets: ["cms-api.internal:3000"] }]
  - job_name: node
    static_configs: [{ targets: ["cms-vm.internal:9100"] }]
