user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  # JSON access log with request id correlation (07-OPS-ARCH §14.3). No query strings with tokens are logged.
  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","status":$status,'
                              '"method":"$request_method","uri":"$uri","bytes":$body_bytes_sent,'
                              '"rt":$request_time,"upstream_rt":"$upstream_response_time","ua":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;

  # Public API micro-cache (NFR-PERF-02: P95 ≤ 200 ms cached). Keyed by API key so
  # per-key rate limits and revocation still apply after at most 30 s.
  proxy_cache_path /var/cache/nginx/public levels=1:2 keys_zone=public_api:10m max_size=256m inactive=10m use_temp_path=off;

  # SEC-07 first line of defence (the API enforces the real limits).
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

  map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

  include /etc/nginx/conf.d/*.conf;
}
